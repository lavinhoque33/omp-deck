[workspace]
resolver = "3"
members = ["crates/deck-core", "crates/deck-host", "crates/deck-term", "crates/deck-service", "crates/deck-remote", "crates/deck-relay", "crates/omp-deck"]

[workspace.package]
edition = "2024"
version = "0.18.3"
license = "MIT OR Apache-2.0"
publish = false
description = "Desktop wrapper for the omp coding-agent TUI: session sidebar, tabs, embedded terminal backed by tmux or its own session host (Linux, Windows)"
repository = "https://github.com/lavinhoque33/omp-deck"
homepage = "https://github.com/lavinhoque33/omp-deck"
authors = ["lavinhoque33 <caspianprince33@yahoo.com>"]
readme = "README.md"

[workspace.dependencies]
deck-core = { path = "crates/deck-core" }
deck-host = { path = "crates/deck-host" }
deck-term = { path = "crates/deck-term" }
deck-service = { path = "crates/deck-service" }
deck-remote = { path = "crates/deck-remote", default-features = false }
deck-relay = { path = "crates/deck-relay" }
# Already in Cargo.lock via eframe/arboard/polling; crates add the API features they call.
windows-sys = "0.61"
libc = "0.2"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
epaint = { version = "0.37", features = ["color_fonts"] }
egui_system_font_provider = "0.37"
alacritty_terminal = "0.26"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"
# Wave 14. Windows self-update unpacks the release zip (PowerShell Compress-Archive → deflate only).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Desktop notifications: Linux talks to org.freedesktop.Notifications directly (one connection,
# ActivationToken + ActionInvoked); Windows toasts via WinRT (`windows`, already in Cargo.lock via
# wgpu-hal/fontique: tag/group per tab so a toast can be replaced and withdrawn). Wayland window raise uses
# xdg-activation on winit's own wl_display (both crates already in Cargo.lock via winit/sctk).
zbus = { version = "5", default-features = false, features = ["async-io"] }
windows = { version = "0.62", default-features = false }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Sharpshooter memory restore takes omp's consolidation lock: pi-natives names it with xxh64.
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Mobile companion slice 3 (docs/notes/mobile-relay.md): Noise device protocol (gateway + test client)
# and the self-hosted relay (axum/tokio; tungstenite clients matching axum's ws). Crates add features.
snow = { version = "0.10", default-features = false }
zeroize = "1"
axum = { version = "0.8", default-features = false }
tokio = "1"
tokio-tungstenite = "0.29"
tungstenite = { version = "0.29", default-features = false }
# R3: the gateway's relay client (tungstenite + rustls/ring + the webpki roots ureq already uses) and the QR code
# painted in the pairing dialog.
rustls = { version = "0.23", default-features = false }
webpki-roots = "1"
qrcodegen = "1.8"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Package the same stripped binary as the tarball: the deb and rpm assets are built
# with --no-build from target/release/omp-deck.
strip = true
