[workspace]
resolver = "3"
members = ["crates/deck-core", "crates/deck-term", "crates/omp-deck"]

[workspace.package]
edition = "2024"
version = "0.4.2"
license = "MIT OR Apache-2.0"
publish = false
description = "Desktop wrapper for the omp coding-agent TUI: session sidebar, tabs, embedded terminal backed by tmux"
repository = "https://github.com/lavinhoque33/omp-deck"
homepage = "https://github.com/lavinhoque33/omp-deck"
authors = ["lavinhoque33 <caspianprince33@yahoo.com>"]
readme = "README.md"

[workspace.dependencies]
deck-core = { path = "crates/deck-core" }
deck-term = { path = "crates/deck-term" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
epaint = { version = "0.37", features = ["color_fonts"] }
egui_system_font_provider = "0.37"
alacritty_terminal = "0.26"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Package the same stripped binary as the tarball: the deb and rpm assets are built
# with --no-build from target/release/omp-deck.
strip = true
