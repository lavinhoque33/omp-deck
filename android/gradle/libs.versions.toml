[versions]
agp = "9.1.0"
androidx-core = "1.15.0"
androidx-activity = "1.10.1"
androidx-webkit = "1.12.1"
androidx-fragment = "1.8.9"
firebase-bom = "33.16.0"
junit = "4.13.2"
org-json = "20250517"
androidx-test-runner = "1.6.2"
androidx-test-ext = "1.2.1"
androidx-test-core = "1.6.1"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "org-json" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
