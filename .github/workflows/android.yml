name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'pwa/**'
      - 'Cargo.toml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'pwa/**'
      - 'Cargo.toml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install web dependencies
        working-directory: pwa
        run: bun install --frozen-lockfile
      - name: Build bundled app and run native unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: ompdeck-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
