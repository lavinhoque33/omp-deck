name: omp canary

# The live suites (a real omp driven through the host, the gateway and the control extension, with
# a scripted model) against the newest omp, daily. They need omp, so no other workflow runs them
# in full. OmpDeck leans on omp's internals and its screens, and omp ships often: CI pins omp
# (OMP_VERSION in ci.yml) so that a new omp never turns an unrelated commit red, and this job is
# where the drift shows up instead. When it fails: fix the drift, then bump OMP_VERSION.
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omp-canary
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          # Same prioritized mirrors as CI, with per-download fallback.
          printf '%s\tpriority:%s\n' \
            'https://mirrors.edge.kernel.org/ubuntu' 1 \
            'https://archive.ubuntu.com/ubuntu' 2 | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get --error-on=any update
          sudo apt-get install -y --no-install-recommends \
            tmux pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Install the latest omp
        run: |
          curl -fsSL https://omp.sh/install | sh -s -- --binary
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/omp" --version

      # The live tests skip themselves without omp (OMPDECK_TEST_OMP, or omp on PATH) and need
      # omp-deck-host built in the test profile. Sandboxed HOME, scripted model: no account.
      - name: Live suites (real omp)
        run: |
          cargo build -p deck-host
          OMPDECK_TEST_OMP="$HOME/.local/bin/omp" cargo test -p deck-core -p deck-service --no-fail-fast
