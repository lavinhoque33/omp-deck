name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tmux pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build host and app
        run: cargo build -p deck-host -p omp-deck

      # conpty.dll + OpenConsole.exe next to omp-deck-host.exe so the host (and the tests that spawn it)
      # sideload the pinned ConPTY instead of the inbox one.
      - name: Fetch ConPTY
        run: ./packaging/windows/fetch-conpty.ps1 -OutDir target/debug -Arch x64

      - run: cargo test --workspace --no-fail-fast

      - name: Install omp
        if: ${{ !cancelled() }}
        run: |
          & ([scriptblock]::Create((irm https://omp.sh/install.ps1))) -Binary
          $ompDir = Join-Path $env:LOCALAPPDATA 'omp'
          if (-not (Test-Path (Join-Path $ompDir 'omp.exe'))) { throw "omp.exe not found in $ompDir" }
          # The installer edits the user PATH; later steps need it in this job's PATH.
          $ompDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $ompDir 'omp.exe') --version

      - name: Live control over the named pipe (real omp)
        if: ${{ !cancelled() }}
        run: |
          $env:OMPDECK_TEST_OMP = Join-Path $env:LOCALAPPDATA 'omp\omp.exe'
          cargo test -p deck-core --test ctl_live -- --nocapture

      - name: Host smoke (omp in ConPTY)
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $host_exe = (Resolve-Path 'target/debug/omp-deck-host.exe').Path
          # Same PATH the previous step appended to GITHUB_PATH (not applied to the current step).
          $env:PATH = (Join-Path $env:LOCALAPPDATA 'omp') + ';' + $env:PATH

          & $host_exe new e2e -- omp
          if ($LASTEXITCODE -ne 0) { throw "omp-deck-host new failed ($LASTEXITCODE)" }
          Start-Sleep -Seconds 8

          $dump = (& $host_exe dump e2e 2>&1 | Out-String)
          Write-Host "---- dump e2e ----"
          Write-Host $dump
          Write-Host "---- end dump ----"
          $dumpExit = $LASTEXITCODE
          if ($dumpExit -ne 0) { throw "omp-deck-host dump failed ($dumpExit)" }
          if ([string]::IsNullOrWhiteSpace($dump)) { throw "dump of e2e is empty: omp produced no output in 8 s" }

          & $host_exe kill e2e
          if ($LASTEXITCODE -ne 0) { throw "omp-deck-host kill failed ($LASTEXITCODE)" }

          $ls = (& $host_exe ls 2>&1 | Out-String)
          Write-Host "---- ls ----"
          Write-Host $ls
          if ($ls -match '(?m)\be2e\b') { throw "e2e still listed after kill" }

      - name: GUI screenshot (restored omp tab through the host)
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = (Join-Path $env:LOCALAPPDATA 'omp') + ';' + $env:PATH
          $env:RUST_LOG = 'info'
          # A one-message omp session plus a persisted open tab for it, so the app restores the tab on launch
          # and starts `omp --resume <file>` in omp-deck-host.
          $proj = Join-Path $env:RUNNER_TEMP 'proj'
          $root = Join-Path $env:RUNNER_TEMP 'sessions'
          $id = '01c00003-0000-4000-8000-000000000003'
          $dir = Join-Path $root 'ci-proj'
          New-Item -ItemType Directory -Force -Path $proj, $dir | Out-Null
          $file = Join-Path $dir "2026-01-01T10-00-00-000Z_$id.jsonl"
          $header = @{ type = 'session'; version = 3; id = $id; timestamp = '2026-01-01T10:00:00.000Z'; cwd = $proj } | ConvertTo-Json -Compress
          $msg = @{ type = 'message'; id = 'm1'; message = @{ role = 'user'; content = 'hello from CI'; timestamp = 1 } } | ConvertTo-Json -Compress -Depth 4
          [IO.File]::WriteAllText($file, "$header`n$msg`n")
          $cfgDir = Join-Path $env:APPDATA 'omp-deck'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          $state = @{
            open_tabs = @(@{ session_name = "omp-$id"; cwd = $proj; session_path = $file; title = 'CI session' })
            active_tab = 0
            check_updates = $false
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $cfgDir 'state.json'), $state)

          $shot = Join-Path $PWD 'shot.png'
          Remove-Item -Force -ErrorAction SilentlyContinue $shot
          New-Item -ItemType Directory -Force -Path app-logs | Out-Null
          $p = Start-Process -FilePath (Resolve-Path 'target/debug/omp-deck.exe').Path `
            -ArgumentList @('--sessions-root', $root, '--screenshot', $shot, '--screenshot-after', '24') `
            -RedirectStandardOutput app-logs/stdout.txt -RedirectStandardError app-logs/stderr.txt -PassThru
          # Real Windows key events into the focused terminal tab: they travel egui -> win32-input-mode records ->
          # omp-deck-host -> ConPTY -> omp. Shift+Enter must insert a newline in omp's editor, not submit.
          Start-Sleep -Seconds 14
          $ws = New-Object -ComObject WScript.Shell
          Write-Host ("AppActivate: {0}" -f $ws.AppActivate($p.Id))
          Start-Sleep -Milliseconds 500
          $ws.SendKeys('typed on windows')
          $ws.SendKeys('+{ENTER}')
          $ws.SendKeys('second line')
          $exited = $p.WaitForExit(120000)
          if (-not $exited) { $p.Kill($true) }
          Write-Host "---- omp-deck stderr ----"; Get-Content app-logs/stderr.txt -ErrorAction SilentlyContinue | Select-Object -Last 80
          Write-Host "---- omp-deck-host ls ----"; & target/debug/omp-deck-host.exe ls
          if (-not $exited) { throw "omp-deck did not exit within 120 s" }
          Write-Host "omp-deck exited with $($p.ExitCode)"
          if (-not (Test-Path $shot)) { throw "screenshot was not written" }
          Write-Host ("shot.png: {0} bytes" -f (Get-Item $shot).Length)
          # The restored tab's session must still be alive in the host after the app exited (detach, not kill).
          $ls = (& target/debug/omp-deck-host.exe ls | Out-String)
          if ($ls -notmatch "omp-$id") { throw "restored tab's host session is not running after the app exited" }
          $screen = (& target/debug/omp-deck-host.exe dump "omp-$id" | Out-String)
          Write-Host "---- dump after typing ----"; Write-Host $screen
          & target/debug/omp-deck-host.exe kill "omp-$id"
          $lines = $screen -split "`r?`n"
          $first = [array]::FindIndex($lines, [Predicate[string]] { param($l) $l -match 'typed on windows' })
          $second = [array]::FindIndex($lines, [Predicate[string]] { param($l) $l -match 'second line' })
          if ($first -lt 0 -or $second -lt 0) { throw "typed text did not reach omp's editor" }
          if ($second -le $first) { throw "Shift+Enter did not start a new line in omp's editor" }

      - name: Stop leftover host sessions
        if: always()
        run: |
          $exe = 'target/debug/omp-deck-host.exe'
          if (Test-Path $exe) { & $exe ls 2>$null | ForEach-Object { & $exe kill $_.Trim() 2>&1 | Out-Null } }
          $global:LASTEXITCODE = 0

      - name: Collect host and app logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path host-logs | Out-Null
          $src = Join-Path $env:LOCALAPPDATA 'omp-deck\host'
          if (Test-Path $src) { Copy-Item -Recurse -Force "$src\*" host-logs }
          if (Test-Path app-logs) { Copy-Item -Recurse -Force app-logs host-logs }
          New-Item -ItemType File -Force -Path host-logs\.keep | Out-Null

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot
          path: shot.png
          if-no-files-found: warn

      - name: Upload host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-logs
          path: host-logs/**
          include-hidden-files: true
          if-no-files-found: warn
