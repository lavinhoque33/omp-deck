name: Release

on:
  push:
    tags: ["v*"]
  # Dry run from any branch: builds, tests and packages every asset, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # ubuntu-22.04 keeps the glibc requirement (2.35) low for the prebuilt binaries.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tmux pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            desktop-file-utils dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        # Baked into the binary for Google Drive backup (see docs/google-drive-setup.md); without
        # them the feature shows as "not available in this build".
        env:
          OMP_DECK_GOOGLE_CLIENT_ID: ${{ secrets.OMP_DECK_GOOGLE_CLIENT_ID }}
          OMP_DECK_GOOGLE_CLIENT_SECRET: ${{ secrets.OMP_DECK_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release -p omp-deck -p deck-host --locked

      - name: Validate desktop file
        run: desktop-file-validate packaging/omp-deck.desktop

      - name: Tarball
        run: packaging/build-tarball.sh "$VERSION"

      - name: AppImage
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool packaging/appimage/build-appimage.sh "$VERSION"

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: .deb
        run: cargo deb -p omp-deck --no-build --output "dist/omp-deck_${VERSION}_amd64.deb"

      - name: .rpm
        run: cargo generate-rpm -p crates/omp-deck --output "dist/omp-deck-${VERSION}-1.x86_64.rpm"

      - name: Checksums
        working-directory: dist
        run: |
          for f in omp-deck-*.tar.gz omp-deck-*.AppImage omp-deck_*.deb omp-deck-*.rpm; do
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          if-no-files-found: error
          path: |
            dist/omp-deck-*.tar.gz
            dist/omp-deck-*.tar.gz.sha256
            dist/omp-deck-*.AppImage
            dist/omp-deck-*.AppImage.sha256
            dist/omp-deck_*.deb
            dist/omp-deck_*.deb.sha256
            dist/omp-deck-*.rpm
            dist/omp-deck-*.rpm.sha256

  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The arm64 runner/build is best effort: a failure there must not block the release.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_arch: x86_64
            experimental: false
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_arch: aarch64
            experimental: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the crate version
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1
          $version = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          OMP_DECK_GOOGLE_CLIENT_ID: ${{ secrets.OMP_DECK_GOOGLE_CLIENT_ID }}
          OMP_DECK_GOOGLE_CLIENT_SECRET: ${{ secrets.OMP_DECK_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release -p omp-deck -p deck-host --locked --target ${{ matrix.target }}

      - name: Fetch ConPTY
        run: ./packaging/windows/fetch-conpty.ps1 -OutDir conpty -Arch ${{ matrix.arch }} -NoticeFile conpty/THIRD-PARTY-ConPTY.txt

      - name: Package zip
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "omp-deck-$env:VERSION-${{ matrix.asset_arch }}-windows"
          $rel = "target/${{ matrix.target }}/release"
          $stage = Join-Path 'dist' "$name-stage"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $stage
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($f in @("$rel/omp-deck.exe", "$rel/omp-deck-host.exe", 'conpty/conpty.dll', 'conpty/OpenConsole.exe', 'LICENSE-MIT', 'LICENSE-APACHE', 'README.md')) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            Copy-Item $f $stage
          }
          $fonts = 'crates/omp-deck/assets/fonts'
          $parts = @(
            'OmpDeck bundles the following third-party components.',
            '',
            '================================================================================',
            (Get-Content -Raw 'conpty/THIRD-PARTY-ConPTY.txt'),
            '================================================================================',
            'Geist font (Geist-VariableFont.ttf)',
            '',
            (Get-Content -Raw "$fonts/Geist-OFL.txt"),
            '================================================================================',
            'Lucide icons font (lucide.ttf)',
            '',
            (Get-Content -Raw "$fonts/lucide-LICENSE.txt")
          )
          [System.IO.File]::WriteAllText((Join-Path $stage 'THIRD-PARTY-NOTICES.txt'), ($parts -join "`r`n"), (New-Object System.Text.UTF8Encoding($false)))
          $zip = Join-Path 'dist' "$name.zip"
          Remove-Item -Force -ErrorAction SilentlyContinue $zip
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          # Same "<hash>  <file>" format as sha256sum on the Linux assets.
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $name.zip`n", (New-Object System.Text.UTF8Encoding($false)))
          Get-Content "$zip.sha256"

      - name: Smoke the packaged zip
        # The release exes use the GUI subsystem: Start-Process -Wait with redirected output exercises the
        # CLI's console handling, and the host must sideload the bundled conpty.dll.
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'zip-smoke'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $dir
          Expand-Archive -Path "dist/omp-deck-$env:VERSION-${{ matrix.asset_arch }}-windows.zip" -DestinationPath $dir
          $host_exe = Join-Path $dir 'omp-deck-host.exe'
          $ns = 'omp-deck-test-release'
          function Invoke-Host([string]$HostArgs) {
            $out = Join-Path $env:RUNNER_TEMP 'host-out.txt'
            $p = Start-Process -FilePath $host_exe -ArgumentList $HostArgs -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            $text = (Get-Content -Raw $out -ErrorAction SilentlyContinue) + (Get-Content -Raw "$out.err" -ErrorAction SilentlyContinue)
            if ($p.ExitCode -ne 0) { throw "omp-deck-host $HostArgs failed ($($p.ExitCode)): $text" }
            return $text
          }
          Invoke-Host "new smoke --ns $ns -- ping.exe -n 30 127.0.0.1" | Out-Null
          Start-Sleep -Seconds 3
          $screen = Invoke-Host "dump smoke --ns $ns"
          Write-Host $screen
          Invoke-Host "kill smoke --ns $ns" | Out-Null
          if ($screen -notmatch '127\.0\.0\.1') { throw "packaged host did not run the session" }
          $log = Get-Content -Raw (Join-Path $env:LOCALAPPDATA "omp-deck\host\$ns\smoke.log")
          Write-Host $log
          if ($log -notmatch 'sideloaded conpty.dll') { throw "packaged host did not load the bundled conpty.dll" }

      - name: Installer round trip
        # packaging/install.ps1 -ZipPath under Windows PowerShell 5.1 and PowerShell 7: install, reinstall while
        # the installed omp-deck-host.exe is running (rename-aside path), uninstall.
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path "dist/omp-deck-$env:VERSION-${{ matrix.asset_arch }}-windows.zip").Path
          $script = (Resolve-Path 'packaging/install.ps1').Path
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\OmpDeck'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'OmpDeck.lnk'
          $ns = 'omp-deck-test-inst'
          $shells = @(
            @{ Name = 'Windows PowerShell 5.1'; Exe = 'powershell.exe' },
            @{ Name = 'PowerShell 7'; Exe = 'pwsh' }
          )

          function Invoke-Installer($shell, [string[]]$extra) {
            & $shell.Exe -NoProfile -ExecutionPolicy Bypass -File $script @extra
            if ($LASTEXITCODE -ne 0) { throw "$($shell.Name): install.ps1 $extra failed ($LASTEXITCODE)" }
          }
          function Assert-Installed($label) {
            foreach ($f in 'omp-deck.exe', 'omp-deck-host.exe', 'conpty.dll', 'OpenConsole.exe') {
              if (-not (Test-Path -LiteralPath (Join-Path $installDir $f))) { throw "$label`: $f missing in $installDir" }
            }
            if (-not (Test-Path -LiteralPath $shortcut)) { throw "$label`: Start Menu shortcut missing" }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
            if ($target -ne (Join-Path $installDir 'omp-deck.exe')) { throw "$label`: shortcut targets '$target'" }
          }
          function Invoke-InstalledHost([string]$HostArgs) {
            $out = Join-Path $env:RUNNER_TEMP 'inst-host-out.txt'
            $p = Start-Process -FilePath (Join-Path $installDir 'omp-deck-host.exe') -ArgumentList $HostArgs `
              -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            $text = (Get-Content -Raw $out -ErrorAction SilentlyContinue) + (Get-Content -Raw "$out.err" -ErrorAction SilentlyContinue)
            if ($p.ExitCode -ne 0) { throw "omp-deck-host $HostArgs failed ($($p.ExitCode)): $text" }
          }

          foreach ($shell in $shells) {
            Write-Host "::group::$($shell.Name)"
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $installDir, $shortcut

            Invoke-Installer $shell @('-ZipPath', $zip, '-NoOmp')
            Assert-Installed "$($shell.Name) first install"

            # Lock the installed host exe: the detached daemon runs from the install dir.
            Invoke-InstalledHost "new lockcheck --ns $ns -- ping.exe -n 60 127.0.0.1"
            Start-Sleep -Seconds 2
            $lockedBefore = @(Get-Process omp-deck-host -ErrorAction SilentlyContinue).Count
            if ($lockedBefore -lt 1) { throw "$($shell.Name): no omp-deck-host daemon is running" }

            Invoke-Installer $shell @('-ZipPath', $zip, '-NoOmp')
            Assert-Installed "$($shell.Name) reinstall over running host"
            $aside = @(Get-ChildItem -LiteralPath $installDir -Filter 'omp-deck-host.exe.old-*')
            if ($aside.Count -lt 1) { throw "$($shell.Name): running omp-deck-host.exe was not renamed aside" }

            Invoke-InstalledHost "kill lockcheck --ns $ns"
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Process omp-deck-host -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 300 }
            if (Get-Process omp-deck-host -ErrorAction SilentlyContinue) { throw "$($shell.Name): host daemon did not exit after kill" }

            Invoke-Installer $shell @('-Uninstall')
            if (Test-Path -LiteralPath $installDir) { throw "$($shell.Name): install dir still present after -Uninstall" }
            if (Test-Path -LiteralPath $shortcut) { throw "$($shell.Name): shortcut still present after -Uninstall" }
            Write-Host "::endgroup::"
            Write-Host "$($shell.Name): OK"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/omp-deck-*-windows.zip
            dist/omp-deck-*-windows.zip.sha256

  publish:
    needs: [linux, windows]
    # Runs even if the best-effort arm64 job failed (its failure is already masked by continue-on-error);
    # never runs when the linux build or the x64 windows build failed.
    if: ${{ github.event_name == 'push' && !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          test -n "$(ls omp-deck-*-x86_64-windows.zip)"
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/omp-deck-*.tar.gz
            dist/omp-deck-*.tar.gz.sha256
            dist/omp-deck-*.AppImage
            dist/omp-deck-*.AppImage.sha256
            dist/omp-deck_*.deb
            dist/omp-deck_*.deb.sha256
            dist/omp-deck-*.rpm
            dist/omp-deck-*.rpm.sha256
            dist/omp-deck-*-windows.zip
            dist/omp-deck-*-windows.zip.sha256
            dist/SHA256SUMS
          generate_release_notes: true
