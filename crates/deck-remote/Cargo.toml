[package]
name = "deck-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OmpDeck mobile companion transport: relay wire format and the Noise device protocol"

[features]
default = ["noise"]
# The device protocol (Noise pairing/reconnect, sessions). The relay builds without it.
noise = [
    "dep:snow",
    "dep:blake2",
    "dep:curve25519-dalek",
    "dep:getrandom",
    "dep:serde",
    "dep:serde_json",
    "dep:zeroize",
]

[dependencies]
thiserror.workspace = true
sha2.workspace = true
base64.workspace = true
# Only the default resolver with X25519, ChaChaPoly, BLAKE2s and OS randomness (no `std`
# feature: it would pull `ring` and `sha2` into snow).
snow = { version = "0.10", default-features = false, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom",
], optional = true }
# The same versions snow uses: key derivation for `Keypair::from_secret` and the fingerprint.
blake2 = { version = "0.10", default-features = false, optional = true }
curve25519-dalek = { version = "4.1.3", default-features = false, optional = true }
getrandom = { version = "0.3", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# A hand-written Noise peer in tests/low_order.rs (snow cannot emit low-order keys).
chacha20poly1305 = "0.10"
