[package]
name = "deck-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "omp-deck-gateway"
path = "src/bin/omp-deck-gateway.rs"

[dependencies]
deck-core.workspace = true
deck-host.workspace = true
deck-term.workspace = true
dirs.workspace = true
thiserror.workspace = true
log.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
getrandom.workspace = true
sha2.workspace = true
env_logger.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Headless desktop notifications: one session-bus connection (Notify, ActivationToken,
# ActionInvoked), the same channel the desktop client used.
zbus.workspace = true
futures-lite = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
