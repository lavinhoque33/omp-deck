[package]
name = "deck-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "omp-deck-gateway"
path = "src/bin/omp-deck-gateway.rs"

[features]
# Test-only: `OMP_DECK_PUSH_TEST_LOOPBACK=1` admits http:// and loopback push endpoints. Never
# enabled for a normal build; the self dev-dependency below enables it for this crate's tests.
test-push-loopback = []

[dependencies]
deck-core.workspace = true
deck-host.workspace = true
deck-term.workspace = true
dirs.workspace = true
thiserror.workspace = true
log.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
getrandom.workspace = true
sha2.workspace = true
env_logger.workspace = true
# Mobile access (R3): the Noise device protocol and relay wire format, the gateway's blocking relay
# client (tungstenite + rustls/ring with the webpki roots ureq already uses), and stored keys.
deck-remote = { workspace = true, features = ["noise"] }
tungstenite = { workspace = true, features = ["handshake", "__rustls-tls"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
webpki-roots.workspace = true
base64.workspace = true
zeroize.workspace = true
# Web Push (slice 4): RFC 8291 requests with a VAPID (ES256, ring) token, sent with the
# blocking ureq through a resolver that refuses non-public addresses.
web-push-native.workspace = true
ring.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Headless desktop notifications: one session-bus connection (Notify, ActivationToken,
# ActionInvoked), the same channel the desktop client used.
zbus.workspace = true
futures-lite = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
deck-service = { path = ".", features = ["test-push-loopback"] }
tempfile.workspace = true
# tests/remote_pairing.rs: an in-test relay on its own tokio runtime.
deck-relay.workspace = true
tokio = { workspace = true, features = ["rt", "net", "macros", "sync", "time"] }
# remote/link.rs tests: a message 1 from a newer device (handshake payload `v` 2), which
# `deck_remote::noise` never writes.
snow = { workspace = true, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom",
] }
